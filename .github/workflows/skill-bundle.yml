name: Skill bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble the self-contained skill
        run: python tools/build_skill.py --output build/skill --notes
      - name: Confirm the stamp matches the checkout
        run: python tools/build_skill.py --check --output build/skill
      - name: Draw the listing icon
        run: python tools/make_skill_icon.py --output build/structural-design-icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: structural-design-skill
          path: |
            build/structural-design.zip
            build/structural-design-release.md
            build/structural-design-icon.png
      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/structural-design.zip
            build/structural-design-release.md
            build/structural-design-icon.png
