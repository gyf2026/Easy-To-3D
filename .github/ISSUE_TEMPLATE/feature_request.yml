name: Feature request / 功能建议
description: Explain the workflow you want to improve.
body:
  - type: textarea
    id: need
    attributes:
      label: User problem / 希望解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow and success criteria / 建议流程与验收标准
    validations:
      required: true
