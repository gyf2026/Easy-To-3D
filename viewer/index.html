<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy-To-3D · 结构评审</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script><body>
<header><strong>Easy-To-3D</strong><span id="projectName">加载项目…</span><span id="dirty" role="status">已保存</span><select id="language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="fr">Français</option></select></header>
<main><aside><p id="modelHealth" role="status">正在检查模型…</p><h2>我的点评</h2><div id="annotations"></div><button id="submit" class="primary" disabled>提交修改</button><textarea id="continuation" readonly hidden></textarea><button id="copy" hidden>复制继续修改指令</button><details><summary>历史版本对比</summary><label>对比版本<select id="versions"></select></label></details><details><summary>显示部件</summary><div id="objects"></div></details><details><summary>确认与下载</summary><div id="checkSummary"></div><label>确认阶段<select id="confirmationKind"><option value="white_model">白模结构</option><option value="design">设计版本</option><option value="delivery">交付版本</option></select></label><label>确认说明<input id="confirmationNote" placeholder="写下你实际确认的范围"></label><button id="confirmVersion">记录我的确认</button><p>让 Agent 保存与准备打印文件</p><button id="agentPrint">复制保存与打印指引</button><textarea id="printInstructions" readonly hidden></textarea><button id="exportPrint">导出打印 STL</button><button id="exportDrawings">导出附图</button><div id="deliveries"></div></details></aside>
<section id="scene"><div id="drawingTools" aria-label="标记工具"><button data-tool="navigate" aria-pressed="true">浏览</button><button data-tool="line" aria-pressed="false">画线</button><label>线型<select id="lineStyle"><option value="line">直线</option><option value="freehand">自由曲线</option></select></label><button data-tool="ruler" aria-pressed="false">直尺</button></div><p id="canvasHint">查看模型，双击需要调整的位置添加意见</p><div id="toolbar"><button data-view="iso">轴测</button><button data-view="front">前视</button><button data-view="top">俯视</button><button data-view="right">右视</button><button id="projection">切换投影</button><button id="fit">适配模型</button><button id="wireframe" aria-pressed="false">线框</button><button id="referenceSystem" aria-pressed="false">显示参考系</button></div><label class="dimension-toggle"><input type="checkbox" id="showDimensions"> 显示尺寸</label><div id="dimensionInfo" hidden aria-live="polite"></div><div id="viewport"><section id="oldViewport" class="model-pane" hidden><span id="oldVersionLabel" class="version-label"></span></section><section id="currentViewport" class="model-pane"><span id="currentVersionLabel" class="version-label" hidden></span></section></div><div id="status" role="status">正在加载…</div></section></main>
<script type="module" src="app.js"></script></body></html>
